version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atmosfer-frontend
    ports:
      - "3012:3000"  # ✅ 3011 → 3012
    environment:
      - REACT_APP_API_URL=http://localhost:8001
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atmosfer-backend
    ports:
      - "8001:8000"  # ✅ 8000 → 8001 (safe)
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/exports:/app/exports
