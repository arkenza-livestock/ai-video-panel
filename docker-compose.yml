version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: atmosfer
      POSTGRES_USER: atmosfer
      POSTGRES_PASSWORD: atmosfer123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atmosfer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmosfer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - atmosfer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://atmosfer:atmosfer123@postgres:5432/atmosfer
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - SECRET_KEY=atmosfer-secret-key-2024
    volumes:
      - ./backend:/app
      - output_volume:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atmosfer-network

  worker:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://atmosfer:atmosfer123@postgres:5432/atmosfer
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - output_volume:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atmosfer-network
    command: celery -A main.celery_app worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
  output_volume:

networks:
  atmosfer-network:
    driver: bridge
