version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atmosfer-backend:latest
    container_name: atmosfer-backend-app
    # Host modunu kaldırıp standart izole porta çekiyoruz
    ports:
      - "8085:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/exports:/app/exports
      - ./backend/atmosfer.db:/app/atmosfer.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: atmosfer-frontend:latest
    container_name: atmosfer-frontend-app
    # Karışıklığı önlemek için dış portu 3020 yapıyoruz
    ports:
      - "3020:3012"
    restart: always
    depends_on:
      - backend
