version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atmosfer-backend:latest
    container_name: atmosfer-backend-app
    # Port çakışmasını aşmak için 8085 yerine temiz bir limana geçtik
    ports:
      - "8090:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/exports:/app/exports
      - ./backend/atmosfer.db:/app/atmosfer.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: atmosfer-frontend:latest
    container_name: atmosfer-frontend-app
    ports:
      - "3020:3012"
    restart: always
    depends_on:
      - backend
