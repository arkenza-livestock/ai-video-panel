version: '3.8'

services:
  # PostgreSQL - Veritabanı
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: atmosfer
      POSTGRES_USER: atmosfer
      POSTGRES_PASSWORD: atmosfer123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atmosfer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmosfer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache ve Message Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - atmosfer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://atmosfer:atmosfer123@postgres:5432/atmosfer
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-atmosfer-super-secret-key-2024}
      - DEBUG=true
    volumes:
      - ./backend:/app
      - output_volume:/app/output
      - temp_volume:/app/temp
      - uploads_volume:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atmosfer-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  worker:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://atmosfer:atmosfer123@postgres:5432/atmosfer
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-atmosfer-super-secret-key-2024}
    volumes:
      - ./backend:/app
      - output_volume:/app/output
      - temp_volume:/app/temp
      - uploads_volume:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atmosfer-network
    command: celery -A main.celery_app worker --loglevel=info --concurrency=4

  # Celery Beat (Scheduled Tasks)
  beat:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://atmosfer:atmosfer123@postgres:5432/atmosfer
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - worker
    networks:
      - atmosfer-network
    command: celery -A main.celery_app beat --loglevel=info

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "3008:3000"
    depends_on:
      - backend
    networks:
      - atmosfer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - atmosfer-network

networks:
  atmosfer-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  output_volume:
  temp_volume:
  uploads_volume:
