version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atmosfer-backend:latest
    container_name: atmosfer-backend-app
    network_mode: "host"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/exports:/app/exports
      - ./backend/atmosfer.db:/app/atmosfer.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: atmosfer-frontend:latest
    container_name: atmosfer-frontend-app
    # Çakışmayı önlemek için dış portu 3015 yaptık
    ports:
      - "3015:3012"
    restart: always
    depends_on:
      - backend
