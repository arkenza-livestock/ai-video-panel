version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atmosfer-backend:latest
    container_name: atmosfer-backend-app
    # HATA DÜZELTİLDİ: Sunucudaki tüm standart port çakışmalarını aşmak için 9005 portu atandı
    ports:
      - "9005:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/exports:/app/exports
      - ./backend/atmosfer.db:/app/atmosfer.db
    restart: always
    networks:
      - atmosfer-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: atmosfer-frontend:latest
    container_name: atmosfer-frontend-app
    ports:
      - "3012:3012"
    restart: always
    depends_on:
      - backend
    networks:
      - atmosfer-network

networks:
  atmosfer-network:
    driver: bridge
