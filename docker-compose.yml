version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atmosfer-frontend
    ports:
      - "3012:3013"
    environment:
      - REACT_APP_API_URL=http://72.62.186.96:8002
      - PORT=3013
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atmosfer-backend
    ports:
      - "8002:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    volumes:
      - ./backend/projects:/app/projects
      - ./backend/exports:/app/exports
