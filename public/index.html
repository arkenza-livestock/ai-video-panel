<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>AI Video Studio</title><style>
:root{--bg:#070b14;--card:#0d1424;--line:#202b3f;--text:#f8fafc;--muted:#94a3b8;--p:#7c3aed;--c:#06b6d4;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,rgba(124,58,237,.22),transparent 38%),#070b14;color:var(--text);font-family:Arial,sans-serif;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}.topnav{display:flex;align-items:center;gap:14px;padding:10px 14px;background:rgba(7,11,20,.94);border-bottom:1px solid var(--line);overflow-x:auto}.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--c));display:grid;place-items:center;font-weight:900}.nav{display:flex;gap:7px}.nav button{white-space:nowrap;background:transparent;border:1px solid transparent;color:#cbd5e1;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}.nav button.active{background:rgba(124,58,237,.20);border-color:rgba(124,58,237,.45);color:#c4b5fd}.spacer{flex:1}.mini{font-size:12px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:6px}.main{padding:10px;height:calc(100vh - 58px);overflow:hidden}.screen{display:none;height:100%}.screen.active{display:block}.editor{display:grid;grid-template-columns:380px minmax(520px,1fr) 380px;gap:10px;height:100%}.panel{background:rgba(13,20,36,.94);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:0}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.panelHead h2{margin:0;font-size:16px}.panelBody{padding:12px;overflow:auto;height:calc(100% - 53px)}input,textarea,select{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;outline:none}textarea{min-height:96px;resize:vertical;line-height:1.45}label{display:block;font-size:12px;color:#cbd5e1;margin:11px 0 6px;font-weight:800}.row,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:9px;padding:10px 12px;background:linear-gradient(135deg,var(--p),var(--c));color:white;font-weight:900;cursor:pointer}.btn.secondary{background:#111827;border:1px solid var(--line);color:#e2e8f0}.btn.red{background:#411622;color:#fecaca;border:1px solid #7f1d1d}.btn:disabled{opacity:.45}.voiceCard{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;background:#0a1020;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px}.play{width:34px;height:34px;border-radius:999px;background:#172033;color:white;border:0;cursor:pointer}.voiceName{font-weight:900;font-size:14px}.tags span{display:inline-block;font-size:10px;color:#cbd5e1;background:#1f2937;border-radius:5px;padding:3px 5px;margin-right:3px}.wave{height:18px;margin-top:5px;background:repeating-linear-gradient(90deg,#64748b 0 2px,transparent 2px 6px);opacity:.65}.preview{height:calc(48vh - 40px);min-height:270px;background:#020617;border-bottom:1px solid var(--line);display:grid;place-items:center;position:relative}.preview video{max-width:100%;max-height:100%}.previewText{background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;position:absolute;bottom:28px;font-size:20px}.controlBar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#080d19;border-bottom:1px solid var(--line);font-size:12px;color:#cbd5e1}.slider{height:4px;background:#1e293b;border-radius:999px;flex:1}.tools{display:flex;gap:7px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}.tools button,.tools label{white-space:nowrap;background:#0b1220;border:1px solid var(--line);color:#cbd5e1;border-radius:8px;padding:8px 10px;cursor:pointer;margin:0;font-weight:700}.timeline{height:calc(52vh - 112px);min-height:245px;background:#070b14;overflow:auto;padding:10px}.track{display:grid;grid-template-columns:86px 1fr;gap:8px;margin-top:8px;align-items:center}.trackLabel{font-size:12px;color:#a5b4fc;background:#0b1220;border:1px solid var(--line);border-radius:7px;padding:8px;text-align:center}.trackLane{display:flex;gap:8px;min-height:54px;background:#09111f;border:1px solid #121c2e;border-radius:9px;padding:6px;overflow-x:auto}.clip{min-width:155px;border:1px solid #475569;border-radius:8px;background:linear-gradient(135deg,#1e293b,#111827);overflow:hidden;cursor:pointer}.clip.selected{outline:2px solid var(--p);border-color:var(--p)}.clip video{width:100%;height:48px;object-fit:cover;display:block}.clip small{display:block;font-size:11px;color:#e2e8f0;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.audioClip{min-width:210px;background:#064e3b;border-color:#0f766e}.musicClip{min-width:420px;background:#0c4a6e;border-color:#0369a1}.subClip{min-width:160px;background:#713f12;border-color:#92400e}.status{white-space:pre-wrap;color:var(--muted);font-size:12px;background:#080d19;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px}.card{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}@media(max-width:1200px){body{overflow:auto}.app{height:auto}.main{height:auto;overflow:auto}.editor{grid-template-columns:1fr}.preview{height:300px}.timeline{height:auto}.panelBody{height:auto}}@media(max-width:700px){.row,.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="topnav"><div class="logo"><div class="mark">AI</div><b>VIDEO STUDIO</b></div><nav class="nav"><button class="active" data-screen="editor">🎬 Proje Editörü</button><button data-screen="voices">🎙️ Ses Kütüphanesi</button><button data-screen="render">▦ Render Kuyruğu</button><button data-screen="api">⚙ API Ayarları</button></nav><div class="spacer"></div><div class="mini"><span class="dot"></span>Çalışıyor</div></header><main class="main"><section class="screen active" id="editor"><div class="editor"><aside class="panel"><div class="panelHead"><h2>Ses Kütüphanesi</h2></div><div class="panelBody"><div id="voiceCards"></div></div></aside><section class="panel"><div class="panelHead"><div><b>Proje:</b> <input name="projectName" form="projectForm" placeholder="Masal Dünyası" style="display:inline;width:180px;margin-left:8px"></div><div><button class="btn secondary" id="saveProjectBtn">Kaydet</button> <button class="btn" id="renderBtn" disabled>Dışa Aktar</button></div></div><div class="preview" id="previewBox"><div class="previewText">Video önizleme</div></div><div class="controlBar"><span>00:00</span><div class="slider"></div><button class="btn secondary" id="previewPlayBtn">▶</button></div><div class="tools"><label>+ Klip Ekle<input id="videoFiles" form="projectForm" name="videos" type="file" accept="video/mp4,video/webm,video/quicktime" multiple required style="display:none"></label><button id="toolCut">✂ Kes</button><button id="toolSplit">⑂ Böl</button><button id="toolDelete">🗑 Sil</button><button id="toolLeft">← Sola</button><button id="toolRight">Sağa →</button><button id="toolSlow">🐢 Yavaşlat</button><button id="toolFast">⚡ Hızlandır</button></div><div class="timeline"><div class="track"><div class="trackLabel">V1<br>Video</div><div class="trackLane" id="videoLane"></div></div><div class="track"><div class="trackLabel">A1<br>Ses</div><div class="trackLane" id="audioLane"></div></div><div class="track"><div class="trackLabel">A2<br>Müzik</div><div class="trackLane" id="musicLane"></div></div><div class="track"><div class="trackLabel">T1<br>Altyazı</div><div class="trackLane" id="subLane"></div></div></div></section><aside class="panel"><div class="panelHead"><h2>Sahne Ayarları</h2></div><div class="panelBody"><form id="projectForm"><div class="card"><label>Karakterler</label><div id="characters"></div><button type="button" class="btn secondary" id="addCharacterBtn" style="width:100%">+ Karakter</button></div><div class="card"><b>Seçili Klip</b><div class="grid2"><div><label>Başlangıç</label><input id="clipStart" type="number" step="0.1" value="0"></div><div><label>Bitiş</label><input id="clipEnd" type="number" step="0.1" value="0"></div></div><label>Video Hızı</label><select id="clipSpeed"><option value="0.25">0.25x</option><option value="0.5">0.5x Yavaş</option><option value="0.75">0.75x</option><option value="1" selected>1x Normal</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="4">4x</option></select><label>Sahne Sesi</label><textarea id="clipVoice"></textarea><label>Sahne Altyazısı</label><input id="clipSubtitle"></div><label>Genel Konuşma Metni</label><textarea name="voiceText" placeholder="[Anlatıcı]\nBir varmış..."></textarea><label>Hazır Müzik</label><input id="musicFile" name="music" type="file" accept="audio/*"><button type="button" class="btn secondary" id="playMusicBtn" style="width:100%;margin-top:8px">▶ Müziği Dinle</button><label>Müzik Promptu</label><textarea name="musicPrompt"></textarea><div class="grid2"><div><label>Ses Seviyesi</label><select name="voiceVolume"><option value="1">%100</option><option value=".9">%90</option></select></div><div><label>Müzik</label><select name="musicVolume"><option value=".2">%20</option><option value=".28" selected>%28</option></select></div></div></form><div class="status" id="statusBox">Hazır.</div></div></aside></div></section><section class="screen" id="voices"><div class="panel"><div class="panelHead"><h2>Ses Kütüphanesi</h2></div><div class="panelBody"><div id="voiceCards2"></div></div></div></section><section class="screen" id="api"><div class="panel"><div class="panelHead"><h2>OpenAI</h2></div><div class="panelBody"><label>API Key</label><input id="openaiKey" type="password" placeholder="sk-proj-..."><button class="btn secondary" id="saveApiBtn">Kaydet</button> <button class="btn" id="testOpenAiBtn">Test Et</button><div class="status" id="apiStatus">Hazır.</div></div></div></section><section class="screen" id="render"><div class="panel"><div class="panelHead"><h2>Render Kuyruğu</h2></div><div class="panelBody" id="projectList">Yükleniyor...</div></div></section></main></div><script>
const VOICES=[["alloy","Alloy - anlatıcı"],["echo","Echo - tok"],["fable","Fable - anlatıcı"],["nova","Nova - canlı"],["shimmer","Shimmer - neşeli"],["onyx","Onyx - derin"],["sage","Sage - olgun"],["coral","Coral - yumuşak"],["ash","Ash - sakin"],["ballad","Ballad - masalsı"]];let clips=[],selectedIndex=-1,currentProjectId=null,charCount=0,currentAudio=null,currentMusic=null;const $=id=>document.getElementById(id);
document.querySelectorAll(".nav button").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));btn.classList.add("active");$(btn.dataset.screen).classList.add("active")});
function voiceOptions(v="alloy"){return VOICES.map(([id,n])=>`<option value="${id}" ${id===v?"selected":""}>${n}</option>`).join("")}function addChar(name="",voice="fable"){charCount++;const id=charCount;const div=document.createElement("div");div.className="card";div.dataset.id=id;div.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><b>Karakter ${id}</b><button type="button" class="btn red remove">Sil</button></div><label>Ad</label><input name="characterName_${id}" value="${name||(id===1?"Anlatıcı":"Karakter "+(id-1))}"><label>Ses</label><select name="openaiVoice_${id}">${voiceOptions(voice)}</select>`;div.querySelector(".remove").onclick=()=>div.remove();$("characters").appendChild(div)}addChar("Anlatıcı","fable");addChar("Karakter 1","nova");$("addCharacterBtn").onclick=()=>addChar();
function renderVoices(target){$(target).innerHTML=VOICES.map(([id,name])=>`<div class="voiceCard"><button class="play" onclick="previewVoice('${id}')">▶</button><div><div class="voiceName">${name}</div><div class="tags"><span>OpenAI</span><span>TR</span></div><div class="wave"></div></div><button class="btn secondary" onclick="alert('Bu sesi karakter ayarından seç: ${id}')">Seç</button></div>`).join("")}renderVoices("voiceCards");renderVoices("voiceCards2");
window.previewVoice=async(v)=>{try{const r=await fetch("/api/tts/preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({voice:v,text:"Merhaba. Bu sesi AI Video Studio için önizliyorsunuz."})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Ses üretilemedi.");if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}currentAudio=new Audio(d.url+"?t="+Date.now());currentAudio.volume=1;await currentAudio.play()}catch(e){alert("Ses önizleme hatası: "+e.message)}};
$("musicFile").onchange=()=>{if($("musicFile").files[0])$("musicLane").innerHTML=`<div class="clip musicClip"><small>${$("musicFile").files[0].name}</small></div>`};$("playMusicBtn").onclick=()=>{const f=$("musicFile").files[0];if(!f)return alert("Önce müzik dosyası seç.");if(currentMusic){currentMusic.pause();currentMusic.currentTime=0}currentMusic=new Audio(URL.createObjectURL(f));currentMusic.play()};
$("videoFiles").onchange=()=>{clips=[...$("videoFiles").files].map(file=>({id:crypto.randomUUID(),file,originalName:file.name,trimStart:0,trimEnd:0,speed:1,sceneVoiceText:"",subtitle:""}));selectedIndex=clips.length?0:-1;renderTimeline();syncInspector()};function renderTimeline(){const lane=$("videoLane");lane.innerHTML="";$("audioLane").innerHTML="";$("subLane").innerHTML="";if(!clips.length){lane.textContent="Klip seçilmedi.";return}clips.forEach((c,i)=>{const el=document.createElement("div");el.className="clip"+(i===selectedIndex?" selected":"");el.onclick=()=>{selectedIndex=i;renderTimeline();syncInspector();previewSelected()};el.innerHTML=`<video src="${URL.createObjectURL(c.file)}" muted></video><small>${i+1}. ${c.file.name} · ${c.speed}x</small>`;lane.appendChild(el);$("audioLane").innerHTML+=`<div class="clip audioClip"><small>sahne-${i+1}-voice.mp3</small></div>`;$("subLane").innerHTML+=`<div class="clip subClip"><small>${c.subtitle||"Altyazı "+(i+1)}</small></div>`});previewSelected()}function previewSelected(){if(selectedIndex<0||!clips[selectedIndex])return;$("previewBox").innerHTML=`<video id="mainPreviewVideo" src="${URL.createObjectURL(clips[selectedIndex].file)}" controls></video>`;$("mainPreviewVideo").playbackRate=Number(clips[selectedIndex].speed||1)}
function syncInspector(){const c=clips[selectedIndex];$("clipStart").value=c?.trimStart||0;$("clipEnd").value=c?.trimEnd||0;$("clipSpeed").value=c?.speed||1;$("clipVoice").value=c?.sceneVoiceText||"";$("clipSubtitle").value=c?.subtitle||""}function updateSelected(){const c=clips[selectedIndex];if(!c)return;c.trimStart=Number($("clipStart").value||0);c.trimEnd=Number($("clipEnd").value||0);c.speed=Number($("clipSpeed").value||1);c.sceneVoiceText=$("clipVoice").value;c.subtitle=$("clipSubtitle").value;renderTimeline()}["clipStart","clipEnd","clipSpeed","clipVoice","clipSubtitle"].forEach(id=>$(id).oninput=updateSelected);function selected(){if(selectedIndex<0||!clips[selectedIndex]){alert("Önce klip seç.");return null}return clips[selectedIndex]}
$("toolDelete").onclick=()=>{if(!selected())return;clips.splice(selectedIndex,1);selectedIndex=Math.min(selectedIndex,clips.length-1);renderTimeline();syncInspector()};$("toolLeft").onclick=()=>{if(!selected()||selectedIndex<=0)return;[clips[selectedIndex-1],clips[selectedIndex]]=[clips[selectedIndex],clips[selectedIndex-1]];selectedIndex--;renderTimeline();syncInspector()};$("toolRight").onclick=()=>{if(!selected()||selectedIndex>=clips.length-1)return;[clips[selectedIndex+1],clips[selectedIndex]]=[clips[selectedIndex],clips[selectedIndex+1]];selectedIndex++;renderTimeline();syncInspector()};$("toolSlow").onclick=()=>{const c=selected();if(!c)return;c.speed=Math.max(.25,Number(c.speed||1)/2);renderTimeline();syncInspector()};$("toolFast").onclick=()=>{const c=selected();if(!c)return;c.speed=Math.min(4,Number(c.speed||1)*2);renderTimeline();syncInspector()};$("toolCut").onclick=()=>{const c=selected();if(!c)return;const s=prompt("Başlangıç saniyesi:",c.trimStart||0);if(s===null)return;const e=prompt("Bitiş saniyesi (0 = sona kadar):",c.trimEnd||0);if(e===null)return;c.trimStart=Number(s||0);c.trimEnd=Number(e||0);renderTimeline();syncInspector()};$("toolSplit").onclick=()=>{const c=selected();if(!c)return;let sp=Number(prompt("Kaçıncı saniyeden bölünsün?","5"));if(!isFinite(sp)||sp<=0)return alert("Geçerli saniye gir.");clips.splice(selectedIndex,1,{...c,id:crypto.randomUUID(),trimEnd:sp},{...c,id:crypto.randomUUID(),trimStart:sp,trimEnd:c.trimEnd||0});renderTimeline();syncInspector()};$("previewPlayBtn").onclick=()=>{const v=$("mainPreviewVideo");if(v){v.playbackRate=Number(clips[selectedIndex]?.speed||1);v.paused?v.play():v.pause()}};
function chars(){const out=[];document.querySelectorAll("#characters .card").forEach(el=>{const id=el.dataset.id,name=el.querySelector(`[name="characterName_${id}"]`)?.value?.trim();if(name)out.push({id,name,voiceSource:"openai",openaiVoice:el.querySelector(`[name="openaiVoice_${id}"]`)?.value||"alloy"})});return out}
$("projectForm").onsubmit=e=>e.preventDefault();$("saveProjectBtn").onclick=async()=>{if(!clips.length)return alert("Önce klip ekle.");const fd=new FormData($("projectForm"));clips.forEach(c=>fd.append("videos",c.file,c.originalName));fd.append("clipsJson",JSON.stringify(clips.map(c=>({id:c.id,originalName:c.originalName,trimStart:c.trimStart,trimEnd:c.trimEnd,speed:c.speed,sceneVoiceText:c.sceneVoiceText,subtitle:c.subtitle}))));fd.append("charactersJson",JSON.stringify(chars()));$("statusBox").textContent="Proje kaydediliyor...";try{const r=await fetch("/api/projects",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error);currentProjectId=d.projectId;$("renderBtn").disabled=false;$("statusBox").textContent=JSON.stringify(d,null,2);loadProjects()}catch(e){$("statusBox").textContent="Hata: "+e.message}};$("renderBtn").onclick=async()=>{if(!currentProjectId)return;$("statusBox").textContent="Render başladı...";try{const r=await fetch(`/api/projects/${currentProjectId}/render`,{method:"POST"});const d=await r.json();if(!r.ok)throw new Error(d.error);$("previewBox").innerHTML=`<video src="${d.outputUrl}" controls></video>`;$("statusBox").textContent=JSON.stringify(d,null,2);loadProjects()}catch(e){$("statusBox").textContent="Render hatası: "+e.message}};
async function loadProjects(){try{const r=await fetch("/api/projects");const d=await r.json();$("projectList").innerHTML=(d.projects||[]).map(p=>`<div class="card"><b>${p.name}</b><br>${p.status}${p.output_url?`<br><a style="color:#67e8f9" href="${p.output_url}" target="_blank">Finali aç</a>`:""}</div>`).join("")||"Proje yok."}catch(e){$("projectList").textContent="Projeler alınamadı."}}loadProjects();async function saveSettings(obj){return(await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)})).json()}$("saveApiBtn").onclick=async()=>{await saveSettings({"api.openai.key":$("openaiKey").value});$("apiStatus").textContent="OpenAI kaydedildi."};$("testOpenAiBtn").onclick=async()=>{$("apiStatus").textContent=JSON.stringify(await(await fetch("/api/test/openai",{method:"POST"})).json(),null,2)};
</script></body></html>
