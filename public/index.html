<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AI Content Studio</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/studio.css"/>
  <link rel="stylesheet" href="/css/modal.css"/>
  <style>
    /* Çift oynatıcının üst üste pürüzsüzce çakışabilmesi için gereken çekirdek stiller */
    .studio-video-buffer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.15s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="modalRoot" class="modalRoot hidden"></div>

  <div id="video-buffer-pool" style="display: none;">
    <video id="player-buffer-a" class="studio-video-buffer" muted playsinline style="opacity: 1; z-index: 2;"></video>
    <video id="player-buffer-b" class="studio-video-buffer" muted playsinline style="opacity: 0; z-index: 1;"></video>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
